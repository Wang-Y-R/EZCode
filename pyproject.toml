[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ezcode"
version = "0.1.0"
description = "EZCode —— 一个从零实现的终端编程智能体（Coding Agent）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.scripts]
ezcode = "ezcode.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ezcode*"]
